[project]
name = "agent-orchestrator"
version = "0.1.0"
description = "Local task orchestrator for isolated Claude Agent SDK workers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
api = [
  "fastapi>=0.125",
  "uvicorn>=0.38",
]
claude = [
  "claude-code-sdk>=0.0.25",
]

[dependency-groups]
dev = [
  "fastapi>=0.125",
  "httpx>=0.28",
  "pytest>=8.0",
  "uvicorn>=0.38",
]

[project.scripts]
agentctl = "agent_orchestrator.cli:main"
agentd = "agent_orchestrator.daemon:main"
agentapi = "agent_orchestrator.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
