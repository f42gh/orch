[project]
name = "orch"
version = "0.1.0"
description = "Local multi-engine agent orchestrator: routes tasks to codex, grok, antigravity or claude in isolated git worktrees"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
mcp = [
  "mcp>=2.0",
]

[dependency-groups]
dev = [
  "mcp>=2.0",
  "pytest>=8.0",
  "pytest-asyncio>=1.4.0",
]

[project.scripts]
orch = "orch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
